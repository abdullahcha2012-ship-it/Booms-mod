name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          dir=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n 1)")
          echo "Building in $dir"
          cd "$dir"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
          rm -f "$GITHUB_WORKSPACE"/out/*-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: booms-all-in-one-tool
          path: out/*.jar
